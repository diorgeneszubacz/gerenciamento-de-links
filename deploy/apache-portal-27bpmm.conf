<VirtualHost *:80>
    # Portal de Serviços 27º BPM/M — http://10.35.94.20/ abre direto no portal.
    # O DocumentRoot continua sendo /var/www/html, então /NOVO/, /Downloads/, /27bpmm/,
    # admin.php e /phpmyadmin/ seguem funcionando exatamente como hoje.
    ServerName 10.35.94.20
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ----- Portal (React compilado) -----
    Define PORTAL_DIST /opt/portal-27bpmm/frontend/dist
    AliasMatch "^/$"                 "${PORTAL_DIST}/index.html"
    AliasMatch "^/(admin|login)/?$"  "${PORTAL_DIST}/index.html"
    Alias /portal-assets             "${PORTAL_DIST}/portal-assets"
    Alias /logo-27bpmm.png           "${PORTAL_DIST}/logo-27bpmm.png"

    <Directory /opt/portal-27bpmm/frontend/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # ----- API (Python/FastAPI) na porta 8001 -----
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /api/ http://127.0.0.1:8001/api/

    ErrorLog ${APACHE_LOG_DIR}/portal-27bpmm-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-27bpmm-access.log combined
</VirtualHost>
