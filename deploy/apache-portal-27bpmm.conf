<VirtualHost *:80>
    # Portal de Serviços 27º BPM/M — abre direto em http://10.35.94.20/
    ServerName 10.35.94.20
    DocumentRoot /opt/portal-27bpmm/frontend/dist

    <Directory /opt/portal-27bpmm/frontend/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Rotas do React (/admin, /login) caem no index.html
        FallbackResource /index.html
    </Directory>

    # API (FastAPI/Python) rodando localmente na porta 8001
    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:8001/api
    ProxyPassReverse /api http://127.0.0.1:8001/api

    # Aliases já existentes no Apache (ex.: /phpmyadmin em conf-enabled/phpmyadmin.conf)
    # continuam funcionando normalmente, pois Alias tem prioridade sobre o DocumentRoot.
    # Se sua página de downloads está em /var/www/html/downloads, descomente:
    # Alias /downloads /var/www/html/downloads
    # <Directory /var/www/html/downloads>
    #     Options +Indexes
    #     Require all granted
    # </Directory>

    ErrorLog ${APACHE_LOG_DIR}/portal-27bpmm-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-27bpmm-access.log combined
</VirtualHost>
